version: '3'
services:
  # Default backend for the unified stack. VictoriaMetrics speaks the InfluxDB
  # line protocol, so the importer writes to it directly (provider=resmed).
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    ports:
      - "8428:8428"
    volumes:
      - ./victoriametrics:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--influxSkipSingleField'
      - '--retentionPeriod=100y'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - victoriametrics
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-health}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana

  resmed-influx:
    build:
      context: .
    container_name: myAir
    depends_on:
      - victoriametrics
    # Put your filled-in config.toml in ./resmed/ (see template.config.toml).
    # Defaults already point [main].backend = "victoriametrics" at the service above.
    volumes:
      - ./resmed:/app/
    restart: always
    mem_limit: 100m
    stdin_open: false
    tty: false

# NOTE: the bundled grafana/dashboard.json targets the legacy InfluxDB backend.
# When using the VictoriaMetrics backend (default), use the PromQL dashboards
# shipped with the unified platform (the health-influx-grafana hub).
